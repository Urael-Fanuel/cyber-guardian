# .github/workflows/daily_scan.yml
# ══════════════════════════════════════════════════════════════
#  Cyber-Guardian — Daily MCP Server Security Scan
#  Runs every day at 03:00 UTC (05:00 Israel time)
#  Also triggerable manually from the GitHub Actions UI
# ══════════════════════════════════════════════════════════════

name: Daily Cyber-Guardian Security Scan

on:
  schedule:
    - cron: "0 3 * * *"          # 03:00 UTC every day
  workflow_dispatch:               # manual trigger button in GitHub UI
    inputs:
      scan_limit:
        description: "Max total items to scan"
        required: false
        default: "30"
      scan_scopes:
        description: "Comma-separated scopes to scan"
        required: false
        default: "mcp,extension,skill"
      scope_limits:
        description: "Per-scope limits, for example mcp:5,extension:10,skill:15"
        required: false
        default: "mcp:5,extension:10,skill:15"
      dry_run:
        description: "Dry run (no Supabase writes)"
        type: boolean
        required: false
        default: false

jobs:
  scan:
    name: Scan MCP, Skills, and IDE Extensions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Checkout ────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Python setup ────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            httpx \
            supabase \
            python-dotenv

      # ── Run scanner ──────────────────────────────────────────
      - name: Run Cyber-Guardian Security Scanner
        env:
          GITHUB_TOKEN:         ${{ secrets.SCANNER_GITHUB_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCAN_LIMIT:           ${{ github.event.inputs.scan_limit || '30' }}
          SCAN_SCOPES:          ${{ github.event.inputs.scan_scopes || 'mcp,extension,skill' }}
          SCAN_SCOPE_LIMITS:    ${{ github.event.inputs.scope_limits || 'mcp:5,extension:10,skill:15' }}
          DRY_RUN:              ${{ github.event.inputs.dry_run || 'false' }}
          CYBER_GUARDIAN_URL:   https://cyberguardianscan.com
          CG_ADMIN_BYPASS_SECRET: ${{ secrets.CG_ADMIN_BYPASS_SECRET }}
          CG_SCAN_DELAY:        "1"
          MAX_RUNTIME_MINUTES:  "10"
        run: |
          echo "══════════════════════════════════════"
          echo "  Starting Cyber-Guardian Scanner"
          echo "  Scan scopes: $SCAN_SCOPES"
          echo "  Scope limits: $SCAN_SCOPE_LIMITS"
          echo "  Scan limit : $SCAN_LIMIT"
          echo "  Dry run    : $DRY_RUN"
          echo "  Time (UTC) : $(date -u)"
          echo "══════════════════════════════════════"
          python mcp_scanner.py

      # ── Upload logs as artifact ──────────────────────────────
      - name: Upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-log-${{ github.run_number }}
          path: "*.log"
          retention-days: 30
          if-no-files-found: ignore

      # ── Notify on failure ─────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::MCP scan failed! Check the logs above."
          # Optional: add a curl call here to a Slack/Discord webhook
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H 'Content-type: application/json' \
          #   --data '{"text":"⚠️ MCP Scanner failed — run #${{ github.run_number }}"}'
