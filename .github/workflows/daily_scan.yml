# .github/workflows/daily_scan.yml
# ══════════════════════════════════════════════════════════════
#  Cyber-Guardian — Daily MCP Server Security Scan
#  Runs every day at 03:00 UTC (05:00 Israel time)
#  Also triggerable manually from the GitHub Actions UI
# ══════════════════════════════════════════════════════════════

name: Daily Cyber-Guardian Security Scan

on:
  schedule:
    - cron: "0 3 * * *"          # 03:00 UTC every day
  workflow_dispatch:               # manual trigger button in GitHub UI
    inputs:
      scan_limit:
        description: "Max total items to scan"
        required: false
        default: "30"
      scan_skills:
        description: "Scan AI Skills"
        type: boolean
        required: false
        default: true
      skill_limit:
        description: "Max AI Skills to scan"
        required: false
        default: "15"
      scan_mcp:
        description: "Scan MCP servers"
        type: boolean
        required: false
        default: true
      mcp_limit:
        description: "Max MCP servers to scan"
        required: false
        default: "10"
      scan_ide_extensions:
        description: "Scan IDE extensions"
        type: boolean
        required: false
        default: true
      ide_extension_limit:
        description: "Max IDE extensions to scan"
        required: false
        default: "5"
      dry_run:
        description: "Dry run (no Supabase writes)"
        type: boolean
        required: false
        default: false

jobs:
  scan:
    name: Scan MCP, Skills, and IDE Extensions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Checkout ────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Python setup ────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            httpx \
            supabase \
            python-dotenv

      - name: Resolve scan plan
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"
          SCAN_LIMIT="${{ inputs.scan_limit }}"
          SCAN_LIMIT="${SCAN_LIMIT:-30}"

          raw_scan_skills="${{ inputs.scan_skills }}"
          raw_skill_limit="${{ inputs.skill_limit }}"
          raw_scan_mcp="${{ inputs.scan_mcp }}"
          raw_mcp_limit="${{ inputs.mcp_limit }}"
          raw_scan_ide_extensions="${{ inputs.scan_ide_extensions }}"
          raw_ide_extension_limit="${{ inputs.ide_extension_limit }}"

          normalize_bool() {
            local raw="${1:-}"
            local default_value="$2"
            raw="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]')"
            case "$raw" in
              true|1|yes|y|on) echo "true" ;;
              false|0|no|n|off) echo "false" ;;
              *) echo "$default_value" ;;
            esac
          }

          normalize_limit() {
            local raw="${1:-}"
            local default_value="$2"
            if [[ "$raw" =~ ^[0-9]+$ ]] && [ "$raw" -gt 0 ]; then
              echo "$raw"
            else
              echo "$default_value"
            fi
          }

          SCAN_SKILLS="$(normalize_bool "$raw_scan_skills" "true")"
          SKILL_LIMIT="$(normalize_limit "$raw_skill_limit" "15")"
          SCAN_MCP="$(normalize_bool "$raw_scan_mcp" "true")"
          MCP_LIMIT="$(normalize_limit "$raw_mcp_limit" "10")"
          SCAN_IDE_EXTENSIONS="$(normalize_bool "$raw_scan_ide_extensions" "true")"
          IDE_EXTENSION_LIMIT="$(normalize_limit "$raw_ide_extension_limit" "5")"

          SCOPES=""
          LIMITS=""

          add_scope() {
            local scope="$1"
            local limit="$2"
            if [ -z "$SCOPES" ]; then
              SCOPES="$scope"
              LIMITS="$scope:$limit"
            else
              SCOPES="$SCOPES,$scope"
              LIMITS="$LIMITS,$scope:$limit"
            fi
          }

          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$SCAN_SKILLS" = "true" ]; then
            add_scope "skill" "$SKILL_LIMIT"
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$SCAN_MCP" = "true" ]; then
            add_scope "mcp" "$MCP_LIMIT"
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$SCAN_IDE_EXTENSIONS" = "true" ]; then
            add_scope "extension" "$IDE_EXTENSION_LIMIT"
          fi

          if [ -z "$SCOPES" ]; then
            echo "::warning::No scan type was selected or GitHub returned empty inputs. Falling back to AI Skills."
            add_scope "skill" "$SKILL_LIMIT"
          fi

          echo "SCAN_LIMIT=$SCAN_LIMIT" >> "$GITHUB_ENV"
          echo "SCAN_SCOPES=$SCOPES" >> "$GITHUB_ENV"
          echo "SCAN_SCOPE_LIMITS=$LIMITS" >> "$GITHUB_ENV"

      # ── Run scanner ──────────────────────────────────────────
      - name: Run Cyber-Guardian Security Scanner
        env:
          GITHUB_TOKEN:         ${{ secrets.SCANNER_GITHUB_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN:              ${{ inputs.dry_run || 'false' }}
          CYBER_GUARDIAN_URL:   https://cyberguardianscan.com
          CG_ADMIN_BYPASS_SECRET: ${{ secrets.CG_ADMIN_BYPASS_SECRET }}
          CG_SCAN_DELAY:        "1"
          GITHUB_FILE_DELAY:    "0.05"
          MAX_REPO_SCAN_FILES:  "25"
          MAX_REPO_SCAN_BYTES:  "900000"
          MAX_ITEM_SECONDS:     "45"
          MAX_CG_SCAN_SECONDS:  "45"
          MAX_RUNTIME_MINUTES:  "10"
        run: |
          echo "══════════════════════════════════════"
          echo "  Starting Cyber-Guardian Scanner"
          echo "  Scan scopes: $SCAN_SCOPES"
          echo "  Scope limits: $SCAN_SCOPE_LIMITS"
          echo "  Scan limit : $SCAN_LIMIT"
          echo "  Dry run    : $DRY_RUN"
          echo "  Time (UTC) : $(date -u)"
          echo "══════════════════════════════════════"
          python mcp_scanner.py

      # ── Upload logs as artifact ──────────────────────────────
      - name: Upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-log-${{ github.run_number }}
          path: "*.log"
          retention-days: 30
          if-no-files-found: ignore

      # ── Notify on failure ─────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::MCP scan failed! Check the logs above."
          # Optional: add a curl call here to a Slack/Discord webhook
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H 'Content-type: application/json' \
          #   --data '{"text":"⚠️ MCP Scanner failed — run #${{ github.run_number }}"}'
