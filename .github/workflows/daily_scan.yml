# .github/workflows/daily_scan.yml
# ══════════════════════════════════════════════════════════════
#  Cyber-Guardian — Daily MCP Server Security Scan
#  Runs every day at 03:00 UTC (05:00 Israel time)
#  Also triggerable manually from the GitHub Actions UI
# ══════════════════════════════════════════════════════════════

name: Daily MCP Security Scan

on:
  schedule:
    - cron: "0 3 * * *"          # 03:00 UTC every day
  workflow_dispatch:               # manual trigger button in GitHub UI
    inputs:
      scan_limit:
        description: "Max servers to scan (default: 200)"
        required: false
        default: "200"
      dry_run:
        description: "Dry run (no Supabase writes)"
        type: boolean
        required: false
        default: false

jobs:
  scan:
    name: Scan MCP Servers
    runs-on: ubuntu-latest
    timeout-minutes: 90            # 1.5 hours max

    steps:
      # ── Checkout ────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Python setup ────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            httpx \
            supabase \
            python-dotenv

      # ── Run scanner ──────────────────────────────────────────
      - name: Run MCP Security Scanner
        env:
          GITHUB_TOKEN:         ${{ secrets.SCANNER_GITHUB_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCAN_LIMIT:           ${{ github.event.inputs.scan_limit || '200' }}
          DRY_RUN:              ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          echo "══════════════════════════════════════"
          echo "  Starting MCP Scanner"
          echo "  Scan limit : $SCAN_LIMIT"
          echo "  Dry run    : $DRY_RUN"
          echo "  Time (UTC) : $(date -u)"
          echo "══════════════════════════════════════"
          python mcp_scanner.py

      # ── Upload logs as artifact ──────────────────────────────
      - name: Upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-log-${{ github.run_number }}
          path: "*.log"
          retention-days: 30
          if-no-files-found: ignore

      # ── Notify on failure ─────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::MCP scan failed! Check the logs above."
          # Optional: add a curl call here to a Slack/Discord webhook
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H 'Content-type: application/json' \
          #   --data '{"text":"⚠️ MCP Scanner failed — run #${{ github.run_number }}"}'
